<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kathaai - Cartoon Story Maker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      max-width: 1000px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      color: #6d28d9;
    }

    .tagline {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .stage {
      min-height: 430px;
      background: linear-gradient(#bae6fd, #f0f9ff);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 80px;
      background: #86efac;
    }

    .character {
      width: 240px;
      height: 330px;
      position: relative;
      z-index: 2;
    }

    .head {
      position: absolute;
      width: 190px;
      height: 190px;
      left: 25px;
      top: 20px;
      background: #f6b98b;
      border: 5px solid #222;
      border-radius: 50%;
    }

    .hair {
      position: absolute;
      width: 185px;
      height: 75px;
      left: -3px;
      top: -5px;
      background: #3f2a20;
      border-radius: 100px 100px 35px 35px;
    }

    .eye {
      position: absolute;
      width: 25px;
      height: 32px;
      background: white;
      border: 3px solid #222;
      border-radius: 50%;
      top: 82px;
    }

    .eye::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 14px;
      background: #111;
      border-radius: 50%;
      left: 5px;
      top: 5px;
    }

    .eye.left {
      left: 50px;
    }

    .eye.right {
      right: 50px;
    }

    .nose {
      position: absolute;
      width: 18px;
      height: 28px;
      border-right: 3px solid #222;
      border-radius: 50%;
      left: 83px;
      top: 115px;
    }

    .mouth {
      position: absolute;
      width: 65px;
      height: 18px;
      background: #8b1e3f;
      border: 3px solid #222;
      border-radius: 0 0 40px 40px;
      left: 59px;
      top: 148px;
      transition: .08s;
    }

    .body {
      position: absolute;
      width: 145px;
      height: 110px;
      left: 48px;
      top: 210px;
      background: #2563eb;
      border: 5px solid #222;
      border-radius: 45px 45px 10px 10px;
    }

    textarea {
      width: 100%;
      height: 170px;
      resize: none;
      padding: 15px;
      font-size: 17px;
      border: 2px solid #ddd;
      border-radius: 15px;
    }

    select {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .speak {
      background: #7c3aed;
      color: white;
    }

    .stop {
      background: #ef4444;
      color: white;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #666;
    }

    @media (max-width: 700px) {
      .main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">🎬 Kathaai</div>

    <div class="tagline">
      तुमची कथा, तुमचा Cartoon!
    </div>

    <div class="main">

      <div class="stage">

        <div class="ground"></div>

        <div class="character">

          <div class="head">

            <div class="hair"></div>

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="nose"></div>

            <div class="mouth" id="mouth"></div>

          </div>

          <div class="body"></div>

        </div>

      </div>


      <div>

        <h2>📖 तुमची कथा</h2>

        <textarea id="story"
          placeholder="इथे तुमची कथा लिहा...">नमस्कार मित्रांनो! Kathaai मध्ये तुमचे स्वागत आहे.</textarea>

        <h3>🗣️ Voice निवडा</h3>

        <select id="voice">
          <option>Voice loading...</option>
        </select>

        <div class="buttons">

          <button class="speak" onclick="speakStory()">
            ▶️ बोलवा
          </button>

          <button class="stop" onclick="stopStory()">
            ⏹️ थांबवा
          </button>

        </div>

        <div class="status" id="status">
          तयार आहे 😊
        </div>

      </div>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
